name: Publish code coverage

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Code coverage]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-results
          path: coverage-results
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate coverage results
        id: coverage
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("coverage-results/coverage-summary.json")
          if report_path.stat().st_size > 10_000:
              raise SystemExit("Coverage summary is unexpectedly large")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          if set(report) != {"schema_version", "pr_number", "head_sha", "total", "changed"}:
              raise SystemExit("Coverage summary has unexpected fields")
          if report["schema_version"] != 1:
              raise SystemExit("Unsupported coverage summary schema")
          if type(report["pr_number"]) is not int or report["pr_number"] <= 0:
              raise SystemExit("Invalid pull request number")
          if report["pr_number"] != int(os.environ["EXPECTED_PR_NUMBER"]):
              raise SystemExit("Coverage summary does not match the pull request")
          if report["head_sha"] != os.environ["EXPECTED_HEAD_SHA"]:
              raise SystemExit("Coverage summary does not match the tested commit")

          expected_metric_fields = {
              "covered_lines",
              "num_statements",
              "missing_lines",
              "percent_covered",
          }
          for scope in ("total", "changed"):
              result = report[scope]
              if set(result) != expected_metric_fields:
                  raise SystemExit(f"Unexpected {scope} coverage fields")
              for field in expected_metric_fields - {"percent_covered"}:
                  if type(result[field]) is not int or result[field] < 0:
                      raise SystemExit(f"Invalid {scope} {field}")
              percent = result["percent_covered"]
              if percent is not None and (
                  type(percent) not in {int, float} or not 0 <= percent <= 100
              ):
                  raise SystemExit(f"Invalid {scope} percent_covered")
              if result["covered_lines"] + result["missing_lines"] != result["num_statements"]:
                  raise SystemExit(f"Inconsistent {scope} coverage counts")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output_file:
              print(f"pr_number={report['pr_number']}", file=output_file)
              for scope in ("total", "changed"):
                  for field, value in report[scope].items():
                      print(f"{scope}_{field}={'' if value is None else value}", file=output_file)
          PY

      - name: Create or update coverage comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        env:
          CHANGED_COVERED_LINES: ${{ steps.coverage.outputs.changed_covered_lines }}
          CHANGED_MISSING_LINES: ${{ steps.coverage.outputs.changed_missing_lines }}
          CHANGED_NUM_STATEMENTS: ${{ steps.coverage.outputs.changed_num_statements }}
          CHANGED_PERCENT: ${{ steps.coverage.outputs.changed_percent_covered }}
          PR_NUMBER: ${{ steps.coverage.outputs.pr_number }}
          TEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TOTAL_COVERED_LINES: ${{ steps.coverage.outputs.total_covered_lines }}
          TOTAL_MISSING_LINES: ${{ steps.coverage.outputs.total_missing_lines }}
          TOTAL_NUM_STATEMENTS: ${{ steps.coverage.outputs.total_num_statements }}
          TOTAL_PERCENT: ${{ steps.coverage.outputs.total_percent_covered }}
        with:
          script: |
            const marker = '<!-- local-vllm-dashboard-code-coverage -->';
            const conclusion = process.env.TEST_CONCLUSION === 'success'
              ? 'Passed'
              : `Failed (${process.env.TEST_CONCLUSION})`;
            const changedPercent = process.env.CHANGED_PERCENT
              ? `${Number(process.env.CHANGED_PERCENT).toFixed(2)}%`
              : 'N/A';
            const body = `${marker}
            ## Code coverage

            **Tests:** ${conclusion}

            | Scope | Coverage | Covered lines | Statements | Missing |
            | --- | ---: | ---: | ---: | ---: |
            | Total | ${Number(process.env.TOTAL_PERCENT).toFixed(2)}% | ${process.env.TOTAL_COVERED_LINES} | ${process.env.TOTAL_NUM_STATEMENTS} | ${process.env.TOTAL_MISSING_LINES} |
            | Changed lines | ${changedPercent} | ${process.env.CHANGED_COVERED_LINES} | ${process.env.CHANGED_NUM_STATEMENTS} | ${process.env.CHANGED_MISSING_LINES} |

            ${process.env.CHANGED_NUM_STATEMENTS === '0' ? '_No executable Python lines changed._\n\n' : ''}[View coverage workflow run](${context.payload.workflow_run.html_url})`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
