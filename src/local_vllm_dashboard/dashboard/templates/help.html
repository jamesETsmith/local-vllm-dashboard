<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Help · vLLM Results Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/dashboard.css">
  </head>
  <body>
    <header class="shell masthead help-masthead">
      <div>
        <p class="eyebrow">Local benchmark observatory</p>
        <h1>vLLM Results</h1>
        <div class="header-links">
          <a class="upload-link" href="{{ request.scope.get('root_path', '') }}/upload">Upload results</a>
          <a class="github-link" href="https://github.com/jamesETsmith/local-vllm-dashboard">View project on GitHub <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </header>

    <main class="shell">
      <nav class="tabs" aria-label="Dashboard sections">
        <a href="{{ request.scope.get('root_path', '') }}/?tab=performance">Performance</a>
        <a href="{{ request.scope.get('root_path', '') }}/?tab=accuracy">Accuracy</a>
        <a href="{{ request.scope.get('root_path', '') }}/?tab=runs">Raw Data Table</a>
        <a class="active" href="{{ request.scope.get('root_path', '') }}/help">Help</a>
      </nav>

      <div class="help-layout">
        <section class="panel help-panel">
          <div class="help-document">{{ help_html|safe }}</div>
        </section>
        <aside class="help-toc" aria-label="Help page contents">
          <p>On this page</p>
          <nav>
            {% for level, anchor, title in help_toc %}
              <a class="help-toc-level-{{ level }}" href="#{{ anchor }}">{{ title }}</a>
            {% endfor %}
          </nav>
        </aside>
      </div>
      <script src="{{ request.scope.get('root_path', '') }}/static/copy-code.js" defer></script>
    </main>
  </body>
</html>
