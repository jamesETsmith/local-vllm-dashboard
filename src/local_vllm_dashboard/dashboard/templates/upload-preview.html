<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review upload · vLLM Results</title>
    <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/dashboard.css">
  </head>
  <body>
    <header class="shell detail-header">
      <a class="back-link" href="{{ request.scope.get('root_path', '') }}/upload">← Choose different files</a>
      <p class="eyebrow">Upload preview</p>
      <h1>Review discovered results</h1>
      <p class="lede">Confirm only after the matched, repeated, missing, unmatched, and invalid entries look correct.</p>
    </header>
    <main class="shell upload-shell">
      <section class="panel upload-report"><pre>{{ report }}</pre></section>
      <form class="confirm-upload" action="{{ request.scope.get('root_path', '') }}/upload/confirm" method="post">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="hidden" name="confirmation" value="{{ confirmation }}">
        <button type="submit" {% if preview.report.result_count == 0 %}disabled{% endif %}>Confirm ingestion of {{ preview.report.result_count }} result{% if preview.report.result_count != 1 %}s{% endif %}</button>
      </form>
    </main>
  </body>
</html>
